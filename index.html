<!doctype html>

    <canvas id="game"></canvas>

            <div class="who">

              <div class="avatar"></div>
            </div>

        <div id="emoteMenu"></div>
        <div id="bubbleYou" class="bubble"></div>
        <div id="bubbleFoe" class="bubble"></div>
      </div>
      <div id="meta"></div>
      <div id="modal"></div>
      <div id="toasts"></div>
      <div id="boot"><b>Sniper Standoff</b><span></span></div>
